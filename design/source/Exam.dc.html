<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Examen blanc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;color:#FFFFFF}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.scroll::-webkit-scrollbar{display:none}
.opt{transition:background .2s,border-color .2s,transform .15s}
.opt:active{transform:scale(.985)}
.bar{transition:width .45s cubic-bezier(.3,.7,.2,1)}
.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000">
  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 58px 0 110px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px">
      <a href="Main.dc.html" aria-label="Quitter l’examen" style="width: 32px; height: 32px; border-radius: 16px; background: rgba(118,118,128,0.24); display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#EBEBF5" stroke-width="2" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg>
      </a>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #2C2C2E; overflow: hidden"><div class="bar" style="height: 100%; border-radius: 3px; background: #FF3B47; width: {{progress}}"></div></div>
      <div style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: rgba(235,235,245,0.6)">{{counter}}</div>
    </div>

    <sc-if value="{{inQuiz}}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{q}}" as="q" hint-placeholder-count="1">
        <div class="rise">
          <div style="padding: 26px 20px 0">
            <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: rgba(235,235,245,0.6)">Examen blanc · 10e kyu · {{q.cat}}</div>
            <h1 style="margin: 6px 0 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: 0.005em">{{q.text}}</h1>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px; margin: 22px 16px 0">
            <sc-for list="{{q.options}}" as="o" hint-placeholder-count="4">
              <button class="opt" onClick="{{o.pick}}" style="{{o.style}}">
                <span style="{{o.badgeStyle}}">{{o.letter}}</span>
                <span style="flex: 1; text-align: left">{{o.label}}</span>
                <sc-if value="{{o.good}}" hint-placeholder-val="{{ false }}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="#248A3D"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 8.8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </sc-if>
                <sc-if value="{{o.bad}}" hint-placeholder-val="{{ false }}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="#D7263D"><circle cx="12" cy="12" r="11"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/></svg>
                </sc-if>
              </button>
            </sc-for>
          </div>
          <sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">
            <div class="rise" style="margin: 16px 16px 0; background: #1C1C1E; border-radius: 16px; padding: 14px 16px">
              <div style="display: flex; align-items: center; gap: 8px">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
                <div style="font-size: 13px; font-weight: 600; color: rgba(235,235,245,0.8)">Explication</div>
              </div>
              <p style="margin: 8px 0 0; font-size: 15px; line-height: 21px; color: #FFFFFF">{{q.explain}}</p>
            </div>
            <button onClick="{{next}}" style="display: block; margin: 16px 16px 0; width: calc(100% - 32px); height: 52px; border: 0; border-radius: 14px; background: #FFFFFF; color: #000000; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">{{nextLabel}}</button>
          </sc-if>
        </div>
      </sc-for>
    </sc-if>

    <sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="padding: 40px 20px 0; text-align: center">
        <div style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 96px; font-weight: 700; line-height: 1; color: #FF3B47">{{score}}<span style="font-size: 40px; color: rgba(235,235,245,0.6)">/6</span></div>
        <h1 style="margin: 12px 0 0; font-size: 28px; font-weight: 700">Examen terminé</h1>
        <p style="margin: 6px 0 0; font-size: 17px; color: rgba(235,235,245,0.6)">{{verdict}}</p>
      </div>
      <div style="margin: 26px 20px 7px; font-size: 13px; color: rgba(235,235,245,0.6); text-transform: uppercase; letter-spacing: 0.02em">À revoir</div>
      <div style="margin: 0 16px; background: #1C1C1E; border-radius: 14px; padding: 0 16px">
        <sc-for list="{{misses}}" as="m" hint-placeholder-count="2">
          <div style="padding: 12px 0; border-bottom: 0.5px solid #38383A; font-size: 15px; line-height: 20px">{{m.text}}</div>
        </sc-for>
        <sc-if value="{{perfect}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 12px 0; font-size: 15px">Rien à revoir. Prêt pour le passage.</div>
        </sc-if>
      </div>
      <button onClick="{{restart}}" style="display: block; margin: 20px 16px 0; width: calc(100% - 32px); height: 52px; border: 0; border-radius: 14px; background: #D7263D; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Recommencer</button>
    </sc-if>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(18,18,20,0.82); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-top: 0.5px solid rgba(255,255,255,0.12); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 7px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.4 12 4l8 6.4V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>Aujourd’hui</a>
    <a href="Syllabus.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #FF3B47; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF3B47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7.5h6"/></svg>Apprendre</a>
    <a href="Kumite.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V7.5a1.5 1.5 0 0 1 3 0V10M10 9.5V6a1.5 1.5 0 0 1 3 0v4M13 9.5V7a1.5 1.5 0 0 1 3 0v4.5M16 10.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 5 14.5V12a1.5 1.5 0 0 1 2-1.4"/></svg>Kumite</a>
    <a href="Agenda.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h10.5A2.5 2.5 0 0 1 19 6v12.5a2 2 0 0 1-2 2H6z"/><path d="M6 3.5v17M9.5 8.5h6M9.5 12h6M9.5 15.5h3.5"/></svg>Journal</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, pick: null, score: 0, misses: [], done: false }; }
  renderVals() {
    const Q = [
      { cat: 'Vocabulaire', text: 'Que signifie « gedan » ?', o: ['Le niveau bas', 'Le niveau moyen', 'Le niveau haut', 'Un coup de pied'], a: 0, ex: 'Gedan désigne le niveau bas, sous la ceinture. Chudan est le niveau moyen (le tronc), jodan le niveau haut (la tête).' },
      { cat: 'Compter', text: 'Comment compte-t-on « quatre » au dojo ?', o: ['Go', 'Shi', 'Roku', 'San'], a: 1, ex: 'Ichi, ni, san, shi : on dit « shi » pour quatre (on entend aussi « yon »). Go vaut cinq.' },
      { cat: 'Positions', text: 'Dans quelle position exécute-t-on Seiken oi tsuki au 10e kyu ?', o: ['Kiba dachi', 'Sanchin dachi', 'Zenkutsu dachi', 'Kokutsu dachi'], a: 2, ex: 'Le syllabus BKOS précise Seiken oi tsuki (jodan, chudan, gedan) en zenkutsu dachi, en avançant.' },
      { cat: 'Techniques', text: 'Avec quelle partie du pied frappe-t-on en kin geri ?', o: ['Le talon', 'Le cou-de-pied', 'Le bol du pied', 'Le tranchant du pied'], a: 1, ex: 'Kin geri frappe vers le haut avec le cou-de-pied (haisoku), pointe tendue.' },
      { cat: 'Stamina', text: 'Combien de push-ups demande la stamina du 10e kyu ?', o: ['10', '15', '20', '25'], a: 0, ex: 'Au 10e kyu : 20 jumping squats, 20 sit-ups et 10 push-ups.' },
      { cat: 'Techniques', text: 'Où revient le poing en hikite ?', o: ['Le long de la cuisse', 'Contre la poitrine, paume vers le haut', 'Devant le visage', 'Sur la ceinture, paume vers le bas'], a: 1, ex: 'En Kyokushin, le hikite revient contre le côté de la poitrine, paume vers le haut, en même temps que la technique.' },
    ];
    const s = this.state, cur = Q[Math.min(s.i, Q.length - 1)];
    const L = ['A', 'B', 'C', 'D'];
    const answered = s.pick !== null;
    const base = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border-radius: 14px; font: inherit; font-size: 17px; color: #FFFFFF; cursor: pointer; ';
    const options = cur.o.map((label, k) => {
      const good = answered && k === cur.a, bad = answered && k === s.pick && k !== cur.a;
      const border = good ? '1.5px solid #30D158' : bad ? '1.5px solid #FF3B47' : '1.5px solid transparent';
      const bg = good ? 'rgba(48,209,88,0.14)' : bad ? 'rgba(255,59,71,0.14)' : '#1C1C1E';
      return {
        label, letter: L[k], good, bad,
        style: base + 'background: ' + bg + '; border: ' + border + (answered && !good && !bad ? '; opacity: 0.55' : ''),
        badgeStyle: 'flex: none; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' + (good ? 'background: #248A3D; color: #FFFFFF' : bad ? 'background: #D7263D; color: #FFFFFF' : 'background: #2C2C2E; color: rgba(235,235,245,0.8)'),
        pick: () => { if (answered) return; const ok = k === cur.a; this.setState({ pick: k, score: s.score + (ok ? 1 : 0), misses: ok ? s.misses : s.misses.concat([{ text: cur.text + ' → ' + cur.o[cur.a] }]) }); },
      };
    });
    const last = s.i >= Q.length - 1;
    return {
      inQuiz: !s.done, finished: s.done, answered,
      q: [{ cat: cur.cat, text: cur.text, options, explain: cur.ex, key: s.i }],
      counter: s.done ? '6/6' : (s.i + 1) + '/6', progress: Math.round(((s.done ? 6 : s.i + (answered ? 1 : 0)) / 6) * 100) + '%',
      nextLabel: last ? 'Voir le résultat' : 'Question suivante',
      next: () => last ? this.setState({ done: true }) : this.setState({ i: s.i + 1, pick: null }),
      score: s.score, misses: s.misses, perfect: s.misses.length === 0,
      verdict: s.score >= 5 ? 'Très bien. Tu connais ton 10e kyu.' : s.score >= 3 ? 'Bonne base. Encore un peu de révision.' : 'Reprends les fiches techniques avant le passage.',
      restart: () => this.setState({ i: 0, pick: null, score: 0, misses: [], done: false }),
    };
  }
}
</script>
</body>
</html>
