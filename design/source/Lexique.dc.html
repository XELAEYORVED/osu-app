<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lexique</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;color:#FFFFFF}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.scroll::-webkit-scrollbar{display:none}
.seg{transition:background .2s}
.press{transition:transform .15s}
.press:active{transform:scale(.97)}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000">
  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 50px 0 110px; box-sizing: border-box">
    <div style="height: 44px; display: flex; align-items: center; padding: 0 8px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; color: #FF3B47; font-size: 17px">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#FF3B47" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Aujourd’hui</a>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 2px 20px 0">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700">Lexique</h1>
      <div style="font-size: 15px; color: rgba(235,235,245,0.6); padding-bottom: 6px">{{total}} termes</div>
    </div>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 14px 16px 0; padding: 2px; border-radius: 9px; background: rgba(118,118,128,0.24)">
      <button class="seg" onClick="{{showList}}" style="{{listStyle}}">Liste</button>
      <button class="seg" onClick="{{showCards}}" style="{{cardsStyle}}">Révision</button>
    </div>

    <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
      <label style="display: flex; align-items: center; gap: 6px; margin: 12px 16px 0; height: 36px; padding: 0 10px; border-radius: 10px; background: rgba(118,118,128,0.24)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.6)" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>
        <input type="search" aria-label="Rechercher un terme" placeholder="Rechercher" value="{{q}}" onInput="{{onSearch}}" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 17px; color: #FFFFFF; outline: none">
      </label>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="margin: 24px 20px 8px; font-size: 20px; font-weight: 700">{{g.title}}</div>
        <div style="margin: 0 16px; background: #1C1C1E; border-radius: 16px; padding-left: 16px">
          <sc-for list="{{g.items}}" as="t" hint-placeholder-count="4">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 13px 16px 13px 0; border-bottom: {{t.sep}}">
              <div style="font-size: 17px; font-weight: 600">{{t.term}}</div>
              <div style="font-size: 15px; color: rgba(235,235,245,0.6); text-align: right">{{t.fr}}</div>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 60px 20px; text-align: center; font-size: 17px; color: rgba(235,235,245,0.6)">Aucun terme pour « {{q}} »</div>
      </sc-if>
    </sc-if>

    <sc-if value="{{isCards}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; justify-content: space-between; padding: 18px 20px 0; font-size: 15px; color: rgba(235,235,245,0.6); font-variant-numeric: tabular-nums">
        <span>Carte {{cardNum}} sur {{total}}</span><span style="color: #30D158">{{known}} connus</span>
      </div>
      <button class="press" onClick="{{flip}}" aria-label="Retourner la carte" style="{{cardStyle}}">
        <sc-if value="{{front}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px">
            <div style="font-size: 13px; font-weight: 600; color: rgba(235,235,245,0.6); text-transform: uppercase; letter-spacing: 0.04em">{{card.cat}}</div>
            <div style="font-size: 38px; font-weight: 700; text-align: center; line-height: 44px">{{card.term}}</div>
            <div style="font-size: 15px; color: rgba(235,235,245,0.6); margin-top: 20px">Toucher pour voir la traduction</div>
          </div>
        </sc-if>
        <sc-if value="{{back}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px">
            <div style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.85)">{{card.term}}</div>
            <div style="font-size: 30px; font-weight: 700; text-align: center; line-height: 36px">{{card.fr}}</div>
          </div>
        </sc-if>
      </button>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 16px 0">
        <button class="press" onClick="{{again}}" style="height: 54px; border: 0; border-radius: 16px; background: #1C1C1E; color: #FF3B47; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">À revoir</button>
        <button class="press" onClick="{{know}}" style="height: 54px; border: 0; border-radius: 16px; background: #FFFFFF; color: #000000; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Je sais</button>
      </div>
      <p style="margin: 14px 24px 0; font-size: 13px; line-height: 18px; color: rgba(235,235,245,0.6); text-align: center">Les termes marqués « À revoir » reviennent plus souvent, jusqu’à ce que tu les connaisses.</p>
    </sc-if>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(18,18,20,0.82); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-top: 0.5px solid rgba(255,255,255,0.12); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 7px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.4 12 4l8 6.4V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>Aujourd’hui</a>
    <a href="Syllabus.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #FF3B47; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF3B47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7.5h6"/></svg>Apprendre</a>
    <a href="Kumite.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V7.5a1.5 1.5 0 0 1 3 0V10M10 9.5V6a1.5 1.5 0 0 1 3 0v4M13 9.5V7a1.5 1.5 0 0 1 3 0v4.5M16 10.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 5 14.5V12a1.5 1.5 0 0 1 2-1.4"/></svg>Kumite</a>
    <a href="Agenda.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h10.5A2.5 2.5 0 0 1 19 6v12.5a2 2 0 0 1-2 2H6z"/><path d="M6 3.5v17M9.5 8.5h6M9.5 12h6M9.5 15.5h3.5"/></svg>Journal</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'list', q: '', card: 0, flipped: false, known: 0 }; }
  renderVals() {
    const T = [
      ['Niveaux', 'Jodan', 'Niveau haut (tête)'], ['Niveaux', 'Chudan', 'Niveau moyen (tronc)'], ['Niveaux', 'Gedan', 'Niveau bas'],
      ['Armes du corps', 'Seiken', 'Poing, deux premières jointures'], ['Armes du corps', 'Tettsui', 'Poing marteau'], ['Armes du corps', 'Haisoku', 'Cou-de-pied'], ['Armes du corps', 'Hiza', 'Genou'], ['Armes du corps', 'Chusoku', 'Bol du pied'],
      ['Techniques', 'Tsuki', 'Coup de poing direct'], ['Techniques', 'Uke', 'Blocage'], ['Techniques', 'Geri', 'Coup de pied'], ['Techniques', 'Barai', 'Balayage'], ['Techniques', 'Hikite', 'Main qui revient à la poitrine'], ['Techniques', 'Kime', 'Arrêt net, concentration finale'],
      ['Positions', 'Fudo dachi', 'Position inébranlable'], ['Positions', 'Zenkutsu dachi', 'Position fléchie avant'], ['Positions', 'Yoi dachi', 'Position de préparation'],
      ['Commandes', 'Hajime', 'Commencez'], ['Commandes', 'Yame', 'Arrêtez'], ['Commandes', 'Mawate', 'Demi-tour'], ['Commandes', 'Naore', 'Revenez en position'], ['Commandes', 'Osu', 'Salut, respect, persévérance'],
      ['Compter', 'Ichi, ni, san', 'Un, deux, trois'], ['Compter', 'Shi, go, roku', 'Quatre, cinq, six'], ['Compter', 'Shichi, hachi', 'Sept, huit'], ['Compter', 'Ku, jū', 'Neuf, dix'],
    ];
    const s = this.state, q = s.q.trim().toLowerCase();
    const hits = T.filter(t => !q || (t[1] + ' ' + t[2]).toLowerCase().includes(q));
    const cats = [...new Set(hits.map(t => t[0]))];
    const groups = cats.map(c => { const it = hits.filter(t => t[0] === c); return { title: c, items: it.map((t, i) => ({ term: t[1], fr: t[2], sep: i < it.length - 1 ? '0.5px solid #38383A' : '0' })) }; });
    const on = 'border: 0; font: inherit; font-size: 13px; font-weight: 600; height: 30px; border-radius: 7px; cursor: pointer; background: #636366; color: #FFFFFF';
    const off = 'border: 0; font: inherit; font-size: 13px; font-weight: 500; height: 30px; border-radius: 7px; cursor: pointer; background: transparent; color: #FFFFFF';
    const c = T[s.card % T.length];
    const card = 'display: block; margin: 12px 16px 0; width: calc(100% - 32px); height: 360px; border: 0; border-radius: 28px; cursor: pointer; padding: 24px; font: inherit; color: #FFFFFF; transition: background .35s; background: ' + (s.flipped ? '#D7263D' : '#1C1C1E');
    const advance = (k) => this.setState({ card: (s.card + 1) % T.length, flipped: false, known: s.known + k });
    return {
      total: T.length, q: s.q, groups, empty: hits.length === 0,
      isList: s.mode === 'list', isCards: s.mode === 'cards',
      listStyle: s.mode === 'list' ? on : off, cardsStyle: s.mode === 'cards' ? on : off,
      showList: () => this.setState({ mode: 'list' }), showCards: () => this.setState({ mode: 'cards' }),
      onSearch: (e) => this.setState({ q: e.target.value }),
      card: { term: c[1], fr: c[2], cat: c[0] }, cardNum: (s.card % T.length) + 1, known: s.known, cardStyle: card,
      front: !s.flipped, back: s.flipped, flip: () => this.setState({ flipped: !s.flipped }),
      again: () => advance(0), know: () => advance(1),
    };
  }
}
</script>
</body>
</html>
