<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvelle séance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;color:#FFFFFF}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.scroll::-webkit-scrollbar{display:none}
.chip{transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
.sw{transition:background .25s}
.knob{transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.reveal{animation:fade .3s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
textarea::placeholder,input::placeholder{color:rgba(235,235,245,0.45)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 100px; background: #000000"></div>
  <div style="position: absolute; left: 0; right: 0; top: 46px; bottom: 0; background: #1C1C1E; border-radius: 14px 14px 0 0; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #48484A; margin: 6px auto 0"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 0; height: 44px">
      <a href="Journal.dc.html" style="color: #FF3B47; font-size: 17px">Annuler</a>
      <div style="font-size: 17px; font-weight: 600">Nouvelle séance</div>
      <a href="Journal.dc.html" style="color: #FF3B47; font-size: 17px; font-weight: 600">Enregistrer</a>
    </div>

    <div class="scroll" style="flex: 1; overflow-y: auto; padding: 6px 16px 40px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px">
        <sc-for list="{{places}}" as="p" hint-placeholder-count="2">
          <button class="chip" onClick="{{p.pick}}" style="{{p.style}}">
            <span style="width: 10px; height: 10px; border-radius: 3px; background: {{p.dot}}"></span>{{p.label}}
          </button>
        </sc-for>
      </div>

      <div style="margin-top: 12px; background: #2C2C2E; border-radius: 12px; padding: 0 14px">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; border-bottom: 0.5px solid #48484A; font-size: 17px"><span>Date</span><span style="color: rgba(235,235,245,0.6)">Aujourd’hui, mer. 7 oct.</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; font-size: 17px">
          <span>Durée</span>
          <div style="display: flex; align-items: center; gap: 12px">
            <span class="num" style="font-weight: 600; min-width: 62px; text-align: right">{{duration}}</span>
            <div style="display: flex; background: #3A3A3C; border-radius: 9px; overflow: hidden">
              <button onClick="{{dec}}" aria-label="Moins 15 minutes" style="width: 44px; height: 32px; border: 0; background: transparent; color: #FFFFFF; font-size: 20px; cursor: pointer">−</button>
              <div style="width: 0.5px; background: #545458; margin: 7px 0"></div>
              <button onClick="{{inc}}" aria-label="Plus 15 minutes" style="width: 44px; height: 32px; border: 0; background: transparent; color: #FFFFFF; font-size: 20px; cursor: pointer">+</button>
            </div>
          </div>
        </div>
      </div>

      <div style="font-size: 13px; color: rgba(235,235,245,0.6); text-transform: uppercase; letter-spacing: 0.02em; margin: 22px 4px 8px">Contenu</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="6"><button class="chip" onClick="{{k.pick}}" style="{{k.style}}">{{k.label}}</button></sc-for>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 22px 4px 8px">
        <div style="font-size: 13px; color: rgba(235,235,245,0.6); text-transform: uppercase; letter-spacing: 0.02em">Intensité</div>
        <div style="font-size: 15px; font-weight: 600; color: {{intColor}}">{{intLabel}}</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="10"><button class="chip" onClick="{{l.pick}}" aria-label="{{l.aria}}" style="{{l.style}}">{{l.n}}</button></sc-for>
      </div>

      <div style="font-size: 13px; color: rgba(235,235,245,0.6); text-transform: uppercase; letter-spacing: 0.02em; margin: 22px 4px 8px">Ressenti</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="4"><button class="chip" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button></sc-for>
      </div>

      <label style="display: block; font-size: 13px; color: rgba(235,235,245,0.6); text-transform: uppercase; letter-spacing: 0.02em; margin: 22px 4px 8px">Ce que le sensei m’a corrigé</label>
      <textarea aria-label="Ce que le sensei m’a corrigé" placeholder="Ex. : hikite trop bas sur oi tsuki" style="width: 100%; box-sizing: border-box; height: 84px; border: 0; border-radius: 12px; padding: 12px 14px; background: #2C2C2E; color: #FFFFFF; font: inherit; font-size: 17px; resize: none; outline: none"></textarea>

      <div style="margin-top: 14px; background: #2C2C2E; border-radius: 12px; padding: 0 14px">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; font-size: 17px">
          <span>Douleur ou gêne</span>
          <button class="sw" onClick="{{togglePain}}" role="switch" aria-checked="{{painAria}}" aria-label="Douleur ou gêne" style="{{painTrack}}"><span class="knob" style="{{painKnob}}"></span></button>
        </div>
      </div>
      <sc-if value="{{pain}}" hint-placeholder-val="{{ false }}">
        <div class="reveal" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
          <sc-for list="{{zones}}" as="z" hint-placeholder-count="6"><button class="chip" onClick="{{z.pick}}" style="{{z.style}}">{{z.label}}</button></sc-for>
        </div>
      </sc-if>

      <button style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; margin-top: 14px; border: 1px dashed #48484A; border-radius: 12px; background: transparent; color: rgba(235,235,245,0.8); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M9 6l1.5-2.5h3L15 6"/></svg>
        Ajouter une photo ou une vidéo
      </button>

      <a href="Journal.dc.html" style="display: flex; align-items: center; justify-content: center; margin-top: 22px; height: 54px; border-radius: 16px; background: #D7263D; color: #FFFFFF; font-size: 17px; font-weight: 600">Enregistrer la séance</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { place: 'dojo', min: 90, kinds: { Kihon: true, Kumite: true }, int: 7, mood: 'Bien', pain: false, zones: {} }; }
  renderVals() {
    const s = this.state;
    const chip = (on, extra = '') => 'height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid ' + (on ? '#FF3B47' : '#3A3A3C') + '; background: ' + (on ? 'rgba(255,59,71,0.16)' : '#2C2C2E') + '; color: ' + (on ? '#FF6B74' : '#FFFFFF') + '; ' + extra;
    const places = [['dojo', 'Au dojo', '#30D158'], ['solo', 'Hors dojo', '#409CFF']].map(([id, label, dot]) => ({
      label, dot, pick: () => this.setState({ place: id }),
      style: 'display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; border: 1.5px solid ' + (s.place === id ? dot : '#3A3A3C') + '; background: ' + (s.place === id ? '#2C2C2E' : 'transparent') + '; color: #FFFFFF',
    }));
    const kinds = ['Kihon', 'Kata', 'Kumite', 'Condition physique', 'Stamina', 'Étirements'].map(label => ({ label, style: chip(!!s.kinds[label]), pick: () => this.setState({ kinds: { ...s.kinds, [label]: !s.kinds[label] } }) }));
    const colorOf = n => n >= 9 ? '#FF3B47' : n >= 7 ? '#FF9F0A' : n >= 4 ? '#30D158' : '#64D2FF';
    const levels = Array.from({ length: 10 }, (_, i) => {
      const n = i + 1, on = n <= s.int;
      return { n, aria: 'Intensité ' + n, pick: () => this.setState({ int: n }),
        style: 'height: 40px; border: 0; border-radius: 8px; padding: 0; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: ' + (on ? colorOf(s.int) : '#2C2C2E') + '; color: ' + (on ? '#000000' : 'rgba(235,235,245,0.6)') };
    });
    const LBL = ['', 'Très facile', 'Facile', 'Facile', 'Modérée', 'Modérée', 'Soutenue', 'Difficile', 'Difficile', 'Très dure', 'Maximale'];
    const moods = ['Épuisé', 'Fatigué', 'Bien', 'En forme'].map(label => ({ label, style: chip(s.mood === label, 'padding: 0 4px'), pick: () => this.setState({ mood: label }) }));
    const zones = ['Genou', 'Tibia', 'Pied', 'Main', 'Épaule', 'Dos'].map(label => ({ label, style: chip(!!s.zones[label]), pick: () => this.setState({ zones: { ...s.zones, [label]: !s.zones[label] } }) }));
    const h = Math.floor(s.min / 60), m = s.min % 60;
    return {
      places, kinds, levels, moods, zones,
      duration: (h ? h + ' h' : '') + (m ? (h ? ' ' : '') + String(m).padStart(h ? 2 : 1, '0') + (h ? '' : ' min') : ''),
      inc: () => this.setState({ min: Math.min(300, s.min + 15) }), dec: () => this.setState({ min: Math.max(15, s.min - 15) }),
      intLabel: s.int + '/10 · ' + LBL[s.int], intColor: colorOf(s.int),
      pain: s.pain, painAria: s.pain ? 'true' : 'false', togglePain: () => this.setState({ pain: !s.pain }),
      painTrack: 'flex: none; position: relative; width: 51px; height: 31px; border-radius: 16px; border: 0; padding: 0; cursor: pointer; background: ' + (s.pain ? '#30D158' : '#39393D'),
      painKnob: 'position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,0.3); transform: ' + (s.pain ? 'translateX(20px)' : 'none'),
    };
  }
}
</script>
</body>
</html>
